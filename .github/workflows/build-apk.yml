name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project (if missing) and apply branding
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.gamexpchub --project-name hisab .
          fi
          sed -i 's/android:label="[^"]*"/android:label="GameX Hisab"/' android/app/src/main/AndroidManifest.xml
          cp -r tool/android_res/* android/app/src/main/res/

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test (accounting engine + widgets)
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk GameX-Hisab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GameX-Hisab-apk
          path: GameX-Hisab.apk

      - name: Publish download on the Releases page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GameX Hisab build ${{ github.run_number }}
          files: GameX-Hisab.apk
